<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="index/f1-logo.avif">
    <title>Login</title>
</head>

<body>
    <main>
        <div class="login container">
            <div class="header">
                <a href="index.html"><img src="index/back.avif" alt="back" title="Back"></a>
                <h1>Login</h1>
            </div>
            <form action="">
                <div class="login-name form-name form-input">
                    <input type="text" name="username" id="login-username" required autocomplete="name">
                    <label for="login-username">Name (UserName)</label>
                </div>
                <div class="login-password form-password form-input">
                    <input type="password" name="password" id="login-password" required autocomplete="off">
                    <label for="login-password">Password</label>
                    <img src="index/hide.avif" alt="show/hide" onclick="eye(this)">
                </div>
                <button type="submit" class="submit">
                    Submit
                </button>
            </form>
            <p class="changer" onclick="logSign()">Create account</p>
        </div>
        <div class="sign-up container">
            <div class="header">
                <a href="index.html"><img src="index/back.avif" alt="back" title="Back"></a>
                <h1>Sign Up</h1>
            </div>
            <form action="">
                <div class="firstname form-input">
                    <input type="text" name="firstname" id="firstname" inputmode="latin-name" required>
                    <label for="firstname">First Name</label>
                </div>
                <div class="sign-up-name form-name form-input">
                    <input type="text" name="username" id="sign-up-username" required autocomplete="name">
                    <label for="sign-up-username">UserName</label>
                </div>
                <div class="email form-input">
                    <input type="email" name="email" id="email" required>
                    <label for="email">Email</label>
                </div>
                <div class="age form-input">
                    <input type="number" min="10" name="age" id="age" required>
                    <label for="age">Age</label>
                </div>
                <div class="sign-up-password form-password form-input">
                    <input type="password" name="password" id="sign-up-password" required autocomplete="off">
                    <label for="sign-up-password">Password</label>
                    <img src="index/hide.avif" alt="show/hide" onclick="eye(this)">
                </div>
                <label for="agreement" class="agreement"><input type="checkbox" name="agreement" id="agreement"
                        required>I Agree to
                    Terms and
                    Conditions of
                    Use.
                </label>
                <button type="submit" class="submit">
                    Submit
                </button>
            </form>
            <p class="changer" onclick="logSign()">Already have an account</p>
        </div>
    </main>
    <script src="login.js"></script>
</body>

</html>
